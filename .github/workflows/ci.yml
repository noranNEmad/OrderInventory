name: OrderInventory CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong@Password123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OrderInventory.slnx

      - name: Build solution
        run: dotnet build OrderInventory.slnx --configuration Release --no-restore

      - name: Run tests
        env:
          Jwt__Key: "ThisIsATestSecretKeyForIntegrationTestsOnly123456"
          ConnectionStrings__TestConnection: "Server=localhost,1433;Database=OrderInventoryIntegrationTestDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;"
        run: dotnet test OrderInventory.slnx --configuration Release --no-build --verbosity normal

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/norannemad/orderinventory-api:latest \
                       -t ghcr.io/norannemad/orderinventory-api:sha-${{ github.sha }} \
                       ./OrderInventory.Api

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'ghcr.io/norannemad/orderinventory-api:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/norannemad/orderinventory-api:latest
          docker push ghcr.io/norannemad/orderinventory-api:sha-${{ github.sha }}

  deploy:
    name: Remote Deployment (SSH)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Validate Deployment Secrets
        id: check-secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment Staged::SSH_HOST, SSH_USER, or SSH_KEY is not configured in GitHub Secrets. Automated remote deployment skipped."
          fi

      - name: Checkout repository
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Prepare remote directory
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: sudo mkdir -p /opt/orderinventory && sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /opt/orderinventory

      - name: Copy docker-compose to server
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/orderinventory"

      - name: Deploy on Remote Server via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/orderinventory
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Verify Deployment Health via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Verifying health endpoint on remote host..."
            for i in {1..12}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health/ready || true)
              if [ "$STATUS" = "200" ]; then
                echo "Deployment verified! Health status: 200 OK"
                exit 0
              fi
              echo "Waiting for service to become healthy... (attempt $i/12, status: $STATUS)"
              sleep 5
            done
            echo "Health check failed after 60 seconds."
            exit 1
