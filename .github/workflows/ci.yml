name: OrderInventory CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong@Password123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OrderInventory.slnx

      - name: Build solution
        run: dotnet build OrderInventory.slnx --configuration Release --no-restore

      - name: Run tests
        env:
          Jwt__Key: "ThisIsATestSecretKeyForIntegrationTestsOnly123456"
          ConnectionStrings__TestConnection: "Server=localhost,1433;Database=OrderInventoryIntegrationTestDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;"
        run: dotnet test OrderInventory.slnx --configuration Release --no-build --verbosity normal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./OrderInventory.Api
          file: ./OrderInventory.Api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/norannemad/orderinventory-api:latest
            ghcr.io/norannemad/orderinventory-api:sha-${{ github.sha }}

  deploy:
    name: Automated Production Deployment
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check Deployment Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::SSH_HOST is not set in GitHub Secrets. Configure SSH_HOST, SSH_USER, and SSH_KEY to enable remote automated deployment."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Copy docker-compose to server
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/orderinventory"

      - name: Deploy on Remote Server via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/orderinventory
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
