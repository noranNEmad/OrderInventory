services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orderinventory-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - orderinventory-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: ghcr.io/norannemad/orderinventory-api:latest
    container_name: orderinventory-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__RunMigrations: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OrderInventoryDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY}
    depends_on:
      sqlserver:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: orderinventory-tunnel
    command: tunnel --url http://api:8080
    depends_on:
      - api

volumes:
  orderinventory-sql-data:
    external: true
    name: orderinventory-sql-data